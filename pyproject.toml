[project]
name = "argus"
version = "0.1.0"
description = "Anomaly detection over metrics and logs: triage tasks, Slack alerts and post-mortem drafts written by an LLM analyst and checked by a second model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.2",
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=17",
  "pyyaml>=6",
  "jinja2>=3.1",
  "typer>=0.12",
  "httpx>=0.27",
  "pydantic>=2.7",
  "claude-agent-sdk>=0.1",
  "mcp>=1.2",
]

[project.scripts]
argus = "argus.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # typer.Option in defaults is the Typer idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E731"]  # readable one-line fixtures
